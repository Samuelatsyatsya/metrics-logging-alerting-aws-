groups:
  - name: rps-observability-alerts
    rules:
      - alert: RPSHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="rps-backend",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="rps-backend"}[5m])), 0.000001)
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: rps-backend
        annotations:
          summary: "High HTTP 5xx error rate (>5%)"
          description: "Backend error rate has been above 5% for 5 minutes."

      - alert: RPSHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="rps-backend"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: rps-backend
        annotations:
          summary: "High p95 latency (>500ms)"
          description: "95th percentile request latency has been above 0.5s for 10 minutes."

      - alert: RPSBackendTargetDown
        expr: up{job="rps-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: rps-backend
        annotations:
          summary: "Backend metrics target is down"
          description: "Prometheus cannot scrape the backend /metrics endpoint."

