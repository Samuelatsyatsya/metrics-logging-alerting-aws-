sonar.projectName=metrics-logging-alerting-aws
sonar.sourceEncoding=UTF-8

# Scan only application code
sonar.sources=backend/src,frontend/src

# Test locations and coverage reports
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/tests/**/*.test.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Ignore generated/build/infrastructure files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.terraform/**,**/terraform/**,**/*.tfstate,**/*.tfstate.*

# Exclude integration-heavy files from coverage gate until dedicated integration tests are added
sonar.coverage.exclusions=backend/src/app.js,backend/src/config/db.js,backend/src/controllers/**,backend/src/models/**,backend/src/routes/**,backend/src/services/**,backend/src/utils/**,backend/src/middleware/metricsMiddleware.js,frontend/src/main.jsx,frontend/src/App.jsx,frontend/src/components/**,frontend/src/hooks/**,frontend/src/services/**,frontend/src/assets/**
